<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geolocation Provider Diagnostics</title>
<style>body{font:16px system-ui,sans-serif;padding:24px;line-height:1.5;color:#f0f6ff;background:#081728}table{border-collapse:collapse}th,td{border:1px solid #475569;padding:8px;text-align:left}</style>
</head><body><h1>Geolocation provider diagnostics</h1><p>Only two-letter country codes are displayed. The page does not log IP addresses.</p><table><thead><tr><th>Service</th><th>Result</th></tr></thead><tbody id="results"></tbody></table>
<script>
const services=[
 ['GeoJS','https://get.geojs.io/v1/ip/country.json',d=>d.country],
 ['ipwho.is','https://ipwho.is/',d=>d.country_code],
 ['IPIP','https://myip.ipip.net/json',d=>({ '中国':'CN', '孟加拉国':'BD', '美国':'US', '新加坡':'SG' }[d.data?.location?.[0]]||d.data?.location?.[0])],
 ['IP.SB','https://api.ip.sb/geoip',d=>d.country_code],
 ['ipquery','https://api.ipquery.io/?format=json',d=>d.location?.country_code],
 ['ipapi.co','https://ipapi.co/json/',d=>d.country_code],
 ['ipconf','https://api.ipconf.me/api/ip',d=>d.country_code||d.country?.code||d.country],
 ['i5p','https://www.i5p.com/api/myip?lang=en',d=>d.country_code||d.countryCode||d.country],
 ['ip125','https://ip125.com/api/myip?lang=en',d=>d.country_code||d.countryCode||d.country]
];
async function check(name,url,read){
 const row=document.createElement('tr');row.innerHTML='<td></td><td>Testing...</td>';row.cells[0].textContent=name;document.getElementById('results').append(row);
 const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),5500);
 try{const r=await fetch(url,{signal:ctl.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);
 const d=await r.json();const c=read(d);row.cells[1].textContent=typeof c==='string'?c.slice(0,60):'reachable (no country field)';
 }catch(err){row.cells[1].textContent='unavailable ('+(err.name||'error')+')';}
 finally{clearTimeout(timer)}
}
Promise.all(services.map(args=>check(...args))).then(()=>document.body.dataset.done='true');
</script></body></html>
